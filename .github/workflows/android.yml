name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Bundle MediaPipe scanner assets
        run: |
          set -euxo pipefail
          mkdir -p public/mediapipe/wasm public/mediapipe/models
          cp -v node_modules/@mediapipe/tasks-vision/wasm/* public/mediapipe/wasm/
          curl -fL --retry 4 --retry-delay 2 \
            -o public/mediapipe/models/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          curl -fL --retry 4 --retry-delay 2 \
            -o public/mediapipe/models/pose_landmarker_lite.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          test -s public/mediapipe/models/face_landmarker.task
          test -s public/mediapipe/models/pose_landmarker_lite.task
          find public/mediapipe -maxdepth 2 -type f -printf '%p %s bytes\n'

      - name: Build web app
        run: npm run build

      - name: Verify packaged scanner assets
        run: |
          test -s dist/mediapipe/models/face_landmarker.task
          test -s dist/mediapipe/models/pose_landmarker_lite.task
          test -n "$(find dist/mediapipe/wasm -type f -name '*.wasm' -print -quit)"

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anicontroller-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
