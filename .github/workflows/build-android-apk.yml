name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/clean-local-ai-android
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run source tests
        run: npm test

      - name: Build web app and sync Android
        run: npm run android:sync

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Give APK a clear filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Anicontroller-v0.3.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anicontroller-Android-APK
          path: Anicontroller-v0.3.0-debug.apk
          if-no-files-found: error
          retention-days: 30
