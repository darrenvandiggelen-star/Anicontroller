plugins {
    id "com.android.application"
}
android {
    namespace "com.darren.offlinecompanion"
    compileSdk 35

    defaultConfig {
        applicationId "com.darren.offlinecompanion"
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "0.7.2"
    }

    signingConfigs {
        companionDebug {
            storeFile file("companion-debug.keystore")
            storePassword "companion123"
            keyAlias "companion"
            keyPassword "companion123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.companionDebug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.companionDebug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Identity / facial geometry - bundled, works offline.
    implementation 'com.google.mlkit:face-mesh-detection:16.0.0-beta3'

    // Full-body 33-point pose model - bundled, works offline.
    implementation 'com.google.mlkit:pose-detection-accurate:18.0.0-beta5'

    // Person cut-out / alpha mask - bundled, works offline.
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
}
