plugins {
    id "com.android.application"
}
android {
    namespace "com.darren.offlinecompanion"
    compileSdk 35

    defaultConfig {
        applicationId "com.darren.offlinecompanion"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled on-device 468-point 3D face mesh model.
    implementation 'com.google.mlkit:face-mesh-detection:16.0.0-beta1'
}
