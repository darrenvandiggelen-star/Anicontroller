plugins {
    id "com.android.application"
}
android {
    namespace "com.darren.offlinecompanion"
    compileSdk 35

    defaultConfig {
        applicationId "com.darren.offlinecompanion"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.3.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Identity / facial geometry - bundled, works offline.
    implementation 'com.google.mlkit:face-mesh-detection:16.0.0-beta1'

    // Full-body 33-point pose model - bundled, works offline.
    implementation 'com.google.mlkit:pose-detection-accurate:18.0.0-beta5'

    // Person cut-out / alpha mask - bundled, works offline.
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
}
